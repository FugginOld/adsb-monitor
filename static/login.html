<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADS-B monitor: log in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232f81f7' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M12 13v8'/%3E%3Cpath d='M8.5 9.5a5 5 0 0 1 7 0'/%3E%3Cpath d='M5.5 6.5a9 9 0 0 1 13 0'/%3E%3Ccircle cx='12' cy='12.5' r='1.5' fill='%232f81f7' stroke='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/vendor/tabler/tabler-icons.min.css">
<style>
  /* Same palette as the dashboard (static/index.html), including its saved theme choice. */
  :root { color-scheme: light; --bg: #f8f8f6; --surface: #ffffff; --surface2: #f1f0ec; --border: rgba(0,0,0,0.09);
          --text: #1a1a18; --text2: #5c5c59; --err-bg: #fcebeb; --err-text: #a32d2d; --accent: #0c447c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg: #1a1a18; --surface: #242422;
          --surface2: #2c2c2a; --border: rgba(255,255,255,0.09); --text: #f0efeb; --text2: #b4b4b0;
          --err-bg: #501313; --err-text: #f09595; --accent: #b5d4f4; } }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #1a1a18; --surface: #242422; --surface2: #2c2c2a;
          --border: rgba(255,255,255,0.09); --text: #f0efeb; --text2: #b4b4b0; --err-bg: #501313; --err-text: #f09595; --accent: #b5d4f4; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 360px; background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 24px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 4px; display: flex; align-items: center; gap: 6px; }
  .sub { color: var(--text2); font-size: 13px; margin: 0 0 18px; }
  label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 4px; }
  input { width: 100%; font: inherit; padding: 8px 10px; border-radius: 8px; border: 0.5px solid var(--border);
          background: var(--surface2); color: var(--text); }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { margin-top: 14px; width: 100%; font: inherit; font-weight: 600; padding: 8px 10px; border-radius: 8px; border: none;
           background: var(--text); color: var(--bg); cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  .msg { margin-top: 12px; font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--err-bg); color: var(--err-text); }
  code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; overflow-wrap: anywhere;
         display: block; margin-top: 8px; padding: 8px; border-radius: 6px; background: var(--surface2); color: var(--text); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1><i class="ti ti-radar" aria-hidden="true"></i> ADS-B monitor</h1>
  <p class="sub">Admin port: log in to continue.</p>

  <form id="login-form" hidden>
    <label for="password">Admin password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button id="login-btn" type="submit">Log in</button>
  </form>

  <div id="setup" hidden>
    <p class="sub" style="margin:0">No admin password is set yet, so the admin port is locked. On the Pi, run:</p>
    <code id="setup-cmd"></code>
    <p class="sub" style="margin:10px 0 0">Then reload this page. The read-only port keeps working meanwhile.</p>
  </div>

  <div id="msg" class="msg" role="alert" hidden></div>
</main>
<script src="/static/js/login.js"></script>
</body>
</html>
